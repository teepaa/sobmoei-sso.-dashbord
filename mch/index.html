const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyoKTudvD3zo8rK7W8jLdSB9ms_LvYi17MHPHLpz4kmKP0wzkLlL6jPSjxgtJEWZryE/exec';

async function run(fn, ...args){
  if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('PASTE_YOUR_GAS_WEB_APP')) {
    throw new Error('ยังไม่ได้ตั้งค่า GAS_WEB_APP_URL ในไฟล์ mch/index.html');
  }
  const response = await fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: fn, args })
  });
  if (!response.ok) throw new Error(`API HTTP ${response.status}`);
  const payload = await response.json();
  if (!payload || payload.ok !== true) {
    throw new Error((payload && payload.error) || 'เกิดข้อผิดพลาดจาก Backend');
  }
  return payload.data;
}
function esc(v){ return String(v ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }

function authMode(mode){

async function submitAuth(e){
  e.preventDefault(); const f=Object.fromEntries(new FormData(e.target).entries()); $('authError').className='hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm';
  try {
    if(window.currentAuthMode==='register'){
      const result = await run('registerUser', f);
      $('authError').className='bg-emerald-50 text-emerald-700 p-3 rounded-lg text-sm';
      $('authError').textContent = result.message || 'ลงทะเบียนสำเร็จ กรุณารอผู้ดูแลระบบอนุมัติบัญชีก่อนเข้าใช้งาน';

      return;

      state.user = await run('loginUser', f);
    }

  }
  catch(err){ $('authError').className='bg-red-50 text-red-600 p-3 rounded-lg text-sm'; $('authError').textContent = err.message || err; }
}

function fiscalYear(monthText){ const p=String(monthText||'').split('-'); const y=Number(p[0]||0); const m=Number(p[1]||1); return m>=10 ? y+1 : y; }
function fiscalMonthOrder(monthText){ const p=String(monthText||'').split('-'); const m=Number(p[1]||1); return m>=10 ? m-10 : m+2; }
function fiscalMonthLabel(monthText){ const names=['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.']; return names[fiscalMonthOrder(monthText)] || monthText; }
function fiscalYearOptions(){ const current=fiscalYear(new Date().toISOString().slice(0,7)); const set=new Set(); for(let y=2024;y<=current+5;y++) set.add(y); state.records.map(r=>fiscalYear(r.month)).filter(Boolean).filter(y=>y>=2024).forEach(y=>set.add(y)); return [...set].sort((a,b)=>b-a); }
function ensureFiscalYear(){ if(!state.filterFiscalYear){ state.filterFiscalYear=String(fiscalYear(new Date().toISOString().slice(0,7))); } }
function fiscalYearSelect(){ ensureFiscalYear(); return `<select class="input max-w-xs" onchange="state.filterFiscalYear=this.value;render()">${fiscalYearOptions().map(y=>`<option value="${y}" ${String(state.filterFiscalYear)===String(y)?'selected':''}>ปีงบประมาณ ${Number(y)+543}</option>`).join('')}</select>`; }
function filteredRecords(){ ensureFiscalYear(); return state.records.filter(r => (state.filterHospital==='All'||r.hospitalId===state.filterHospital) && String(fiscalYear(r.month))===String(state.filterFiscalYear)); }
function pregnancySummary(records){
  // หลักการ: หญิงตั้งครรภ์สะสม = ยอดเก่ายกมาต้นปีงบประมาณ (นับครั้งเดียว/สถานบริการ) + รายใหม่สะสม R0+R1+R2+R3
  const firstByHospital = {};
  let newPregnant = 0;

  [...records].sort((a,b)=>fiscalMonthOrder(a.month)-fiscalMonthOrder(b.month)).forEach(r=>{
    const h = r.hospitalId || 'ไม่ระบุ';
    if(!firstByHospital[h]){
      firstByHospital[h] = {
        carry:num(r.pregnantCarry),
        carryThai:num(r.pregnantCarryThai),
        carryForeign:num(r.pregnantCarryForeign)
      };
    }
    newPregnant += num(r.riskLevel0)+num(r.riskLevel1)+num(r.riskLevel2)+num(r.riskLevel3);
  });

  const carry = Object.values(firstByHospital).reduce((sum,x)=>sum+num(x.carry),0);
  const carryThai = Object.values(firstByHospital).reduce((sum,x)=>sum+num(x.carryThai),0);
  const carryForeign = Object.values(firstByHospital).reduce((sum,x)=>sum+num(x.carryForeign),0);
  return {carry, carryThai, carryForeign, newPregnant, total:carry+newPregnant};
}

function pregnancyMonthlyCumulative(records){
  const summary = pregnancySummary(records);
  const byMonth = {};
  records.forEach(r=>{
    const m = r.month || 'ไม่ระบุ';
    byMonth[m] = (byMonth[m]||0) + num(r.riskLevel0)+num(r.riskLevel1)+num(r.riskLevel2)+num(r.riskLevel3);
  });
  const months = Object.keys(byMonth).sort((a,b)=>fiscalMonthOrder(a)-fiscalMonthOrder(b));
  let running = summary.carry;
  const cumulative = {};
  months.forEach(m=>{
    running += byMonth[m];
    cumulative[m] = running;
  });
  return cumulative;
}

function qualityCard(label,done,total,target,icon){
  const n=num(done), d=num(total), goal=num(target);
  if(d<=0){
    return `<div class="quality-card"><div class="font-semibold">${icon} ${label}</div><div class="text-2xl font-bold text-amber-600 mt-2">—</div><div class="text-xs text-amber-700 mt-1">ยังไม่มีฐานประเมิน</div></div>`;
  }
  const rate=pct(n,d);
  const invalid = n>d || rate>100;
  const ok = !invalid && rate>=goal;
  const near = !invalid && !ok && rate>=Math.max(0,goal-10);
  const cls = invalid?'text-amber-600':(ok?'text-emerald-600':(near?'text-amber-600':'text-red-600'));
  const status = invalid?'⚠️ ตรวจสอบข้อมูล':(ok?'ผ่านเกณฑ์':(near?'ใกล้เกณฑ์':'ต่ำกว่าเกณฑ์'));
  return `<div class="quality-card"><div class="font-semibold">${icon} ${label}</div><div class="text-2xl font-bold ${cls} mt-2">${rate}%</div><div class="text-xs text-gray-400">${n}/${d} ราย</div><div class="text-xs mt-2 ${cls}">${status}</div></div>`;
}

function aiSummary(records){
  const s = records.reduce((a,r)=>{a.carry+=num(r.pregnantCarry);a.total+=num(r.pregnantCarry)+num(r.riskLevel0)+num(r.riskLevel1)+num(r.riskLevel2)+num(r.riskLevel3);a.r1+=num(r.riskLevel1);a.r2+=num(r.riskLevel2);a.r3+=num(r.riskLevel3);a.foreign+=num(r.pregnantForeign);a.delivery+=num(r.deliveryHospital)+num(r.deliveryHealthCenter)+num(r.deliveryHome)+num(r.deliveryWay);a.home+=num(r.deliveryHealthCenter)+num(r.deliveryHome)+num(r.deliveryWay);a.drugScreened+=num(r.drugScreened);a.drug+=num(r.drugFound);a.psych+=num(r.psychTotal);a.psychMeds+=num(r.psychMeds);a.ancComplete+=num(r.ancComplete);a.ancTarget+=num(r.ancTarget);a.ancEarly+=num(r.ancEarly);a.ancEarlyTarget+=num(r.ancEarlyTarget);a.postpartumComplete+=num(r.postpartumComplete);a.postpartumTarget+=num(r.postpartumTarget);a.conMed+=num(r.contraceptionMedical);a.conMedT+=num(r.contraceptionMedicalTarget);a.conPsych+=num(r.contraceptionPsych);a.conPsychT+=num(r.contraceptionPsychTarget);a.diabetes+=num(r.diabetesPregnant);a.anc8+=num(r.ancComplete8);a.anc8Target+=num(r.anc8Target);return a;},{carry:0,total:0,r1:0,r2:0,r3:0,foreign:0,delivery:0,home:0,drugScreened:0,drug:0,psych:0,psychMeds:0,ancComplete:0,ancTarget:0,ancEarly:0,ancEarlyTarget:0,postpartumComplete:0,postpartumTarget:0,conMed:0,conMedT:0,conPsych:0,conPsychT:0,diabetes:0,anc8:0,anc8Target:0});
  const preg = pregnancySummary(records);
  s.carry = preg.carry;
  s.newPregnant = preg.newPregnant;
  s.total = preg.total;
  s.risk = s.r2 + s.r3;
  s.riskRate = pct(s.risk, s.total);
  s.homeRate = pct(s.home, s.delivery);
  s.drugRate = pct(s.drug, s.drugScreened);
  s.ancRate = pct(s.ancComplete, s.ancTarget);
  s.anc8Rate = pct(s.anc8, s.total);
  s.ancEarlyRate = pct(s.ancEarly, s.ancEarlyTarget);
  s.postpartumRate = pct(s.postpartumComplete, s.postpartumTarget);
  s.conMedRate = pct(s.conMed, s.conMedT);
  s.conPsychRate = pct(s.conPsych, s.conPsychT);
  return s;
}
function aiHospitalHotspots(records){
  const map = {};
  records.forEach(r=>{ const h=r.hospitalId||'ไม่ระบุ'; map[h]=map[h]||{r2:0,r3:0,home:0,drug:0,psych:0}; map[h].r2+=num(r.riskLevel2); map[h].r3+=num(r.riskLevel3); map[h].home+=num(r.deliveryHealthCenter)+num(r.deliveryHome)+num(r.deliveryWay); map[h].drug+=num(r.drugFound); map[h].psych+=num(r.psychTotal); });
  return Object.entries(map).map(([hospital,v])=>({hospital,score:v.r3*5+v.r2*3+v.home*3+v.drug*4+v.psych*2,...v})).sort((a,b)=>b.score-a.score).slice(0,3);
}

function showRuleBasedAnalysis(panel, s, records){
  const hot = aiHospitalHotspots(records);
  const hasKey = true;

  // KPI analysis
  const kpis = [
    { label:'ฝากครรภ์ครบ 8 ครั้ง', val:s.anc8, total:s.total, target:80 },
    { label:'ฝากครรภ์ก่อน 12 สัปดาห์', val:s.ancEarly, total:s.ancEarlyTarget, target:80 },

    { label:'คุมกำเนิด หญิงโรคอายุรกรรม', val:s.conMed, total:s.conMedT, target:80 },
    { label:'คุมกำเนิด หญิงจิตเวช', val:s.conPsych, total:s.conPsychT, target:80 },
  ];
  const kpiHTML = kpis.filter(k=>k.total>0).map(k=>{
    const r=pct(k.val,k.total); const st=aiKpiStatus(r,k.target);
    return `<div class="kpi-card ${st.cls}"><p class="text-xs font-semibold mb-1">${k.label}</p><div class="flex items-end gap-2"><p class="text-2xl font-bold">${r}%</p><p class="text-xs opacity-70 mb-1">${k.val}/${k.total}</p></div><div class="mt-2 h-1.5 rounded-full bg-black/10"><div class="h-1.5 rounded-full bg-current" style="width:${Math.min(r,100)}%"></div></div><span class="ai-badge ${st.badge} mt-2">${st.label}</span></div>`;
  }).join('');

  // Issues — ordered by severity
  const issues = [];
  if(s.r3>0) issues.push({sev:3, text:`🔴 R3 อันตราย <b>${s.r3} ราย</b> — ต้องติดตามเร่งด่วน ทำทะเบียนรายชื่อเฉพาะราย`});
  if(s.drug>0) issues.push({sev:3, text:`🔴 พบสารเสพติด <b>${s.drug} ราย</b> (${s.drugRate}%) — เชื่อมงาน MCH กับระบบบำบัดยาเสพติด`});
  if(s.home>0) issues.push({sev:2, text:`🟡 คลอดนอก รพ. <b>${s.home} ราย</b> (${s.homeRate}%) — ทบทวนแผนคลอดและเส้นทางส่งต่อรายบุคคล`});
  if(s.r2>0) issues.push({sev:2, text:`🟡 R2 เสี่ยงสูง <b>${s.r2} ราย</b> — นัดประเมินซ้ำและจัดระบบส่งต่อให้ชัดเจน`});
  if(s.diabetes>0) issues.push({sev:2, text:`🟡 เบาหวานขณะตั้งครรภ์ (GDM) <b>${s.diabetes} ราย</b> — ติดตามระดับน้ำตาล วางแผนคลอดใน รพ.`});
  if(s.psych>0) issues.push({sev:2, text:`🟡 จิตเวช <b>${s.psych} ราย</b> — ตรวจต่อเนื่องการรับยา ดูแลความปลอดภัยแม่-เด็ก`});
  if(s.foreign>0) issues.push({sev:1, text:`🟢 ต่างชาติ <b>${s.foreign} ราย</b> — ติดตามสิทธิ์รักษาและการฝากครรภ์ครบตามเกณฑ์`});
  const anc8Rate=pct(s.anc8,s.total); if(s.total>0&&anc8Rate<80) issues.push({sev:2, text:`🟡 ฝากครรภ์ครบ 8 ครั้ง <b>${anc8Rate}%</b> — ต่ำกว่าเป้าหมาย WHO ควรเพิ่มการนัดหมายและติดตาม`});
  if(s.ancEarlyTarget>0&&s.ancEarlyRate<80) issues.push({sev:1, text:`🟡 ฝากครรภ์ก่อน 12 สัปดาห์ <b>${s.ancEarlyRate}%</b> — ชักชวนฝากครรภ์เร็วขึ้น`});
  if(s.postpartumTarget>0&&s.postpartumRate<80) issues.push({sev:2, text:`🟡 หลังคลอดครบ 3 ครั้ง <b>${s.postpartumRate}%</b> — ติดตามนัดหมายหลังคลอดให้ครบ`});
  if(s.conMedT>0&&s.conMedRate<80) issues.push({sev:1, text:`🟡 คุมกำเนิดหญิงโรคอายุรกรรม <b>${s.conMedRate}%</b> — ต่ำกว่าเป้า 80%`});
  if(s.conPsychT>0&&s.conPsychRate<80) issues.push({sev:1, text:`🟡 คุมกำเนิดหญิงจิตเวช <b>${s.conPsychRate}%</b> — ต่ำกว่าเป้า 80%`});
  issues.sort((a,b)=>b.sev-a.sev);
  if(!issues.length) issues.push({sev:0, text:'🟢 ภาพรวมยังไม่พบสัญญาณเสี่ยงเด่น'});

  const urgentCount = issues.filter(i=>i.sev===3).length;
  const warnCount = issues.filter(i=>i.sev===2).length;

function chartData(){
  const records = filteredRecords();
  const pregCumulative = pregnancyMonthlyCumulative(records);
  const byMonth = {}, hosp = {};
  records.forEach(r => {
    const m = r.month || 'ไม่ระบุ';
    byMonth[m] = byMonth[m] || { total:0, r1:0, r2:0, r3:0, risk:0, delivery:0 };
    byMonth[m].total = pregCumulative[m] || 0;
    byMonth[m].r1 += num(r.riskLevel1);
    byMonth[m].r2 += num(r.riskLevel2);
    byMonth[m].r3 += num(r.riskLevel3);
    byMonth[m].risk += num(r.riskLevel2)+num(r.riskLevel3);
    byMonth[m].delivery += num(r.deliveryHospital)+num(r.deliveryHealthCenter)+num(r.deliveryHome)+num(r.deliveryWay);
    const h = r.hospitalId || 'ไม่ระบุ';
    hosp[h] = hosp[h] || { r2:0, r3:0, risk:0, delivery:0 };
    hosp[h].r2 += num(r.riskLevel2);
    hosp[h].r3 += num(r.riskLevel3);
    hosp[h].risk += num(r.riskLevel2)+num(r.riskLevel3);
    hosp[h].delivery += num(r.deliveryHospital)+num(r.deliveryHealthCenter)+num(r.deliveryHome)+num(r.deliveryWay);
  });
  const months = Object.keys(byMonth).sort((a,b)=>fiscalMonthOrder(a)-fiscalMonthOrder(b));
  const labels = [], r2 = [], r3 = [], risk = [], delivery = [];
  Object.keys(hosp).slice(0,10).forEach(h => { labels.push(h.replace('รพ.สต.','')); r2.push(hosp[h].r2); r3.push(hosp[h].r3); risk.push(hosp[h].risk); delivery.push(hosp[h].delivery); });
  return { months:months.map(fiscalMonthLabel), total:months.map(m=>byMonth[m].total), r1:months.map(m=>byMonth[m].r1), r2:months.map(m=>byMonth[m].r2), r3:months.map(m=>byMonth[m].r3), risk:months.map(m=>byMonth[m].risk), delivery:months.map(m=>byMonth[m].delivery), hosp:{labels,r2,r3,risk,delivery} };
}

function editRecord(id){ if(state.user.role==='viewer') return; state.editing=state.records.find(r=>r.id===id); state.tab='entry'; render(); }
async function saveRecord(e){ e.preventDefault(); if(state.user.role==='viewer'){ alert('บัญชี Viewer ดูข้อมูลได้อย่างเดียว'); return; } const record=Object.fromEntries(new FormData(e.target).entries()); const yearCE=Number(record.entryYear)-543; record.month=yearCE + '-' + String(record.entryMonth).padStart(2,'0'); delete record.entryYear; delete record.entryMonth; if(Number(fiscalYear(record.month))+543 < 2567){ alert('บันทึกได้ตั้งแต่ปีงบประมาณ 2567 เป็นต้นไป'); return; } if(state.user.role!=='admin') record.hospitalId=state.user.hospital; NUM_FIELDS.forEach(f=>record[f]=Number(record[f]||0)); setLoading(true); try { const saved = await run('saveRecord',{user:state.user,record}); await refresh(); state.tab='dashboard'; state.editing=null; if(saved && saved._merged){ alert('มีข้อมูลของสถานบริการนี้ในเดือนนี้อยู่แล้ว ระบบได้ปรับปรุงข้อมูลเดิมให้แทน (ไม่ได้สร้างรายการซ้ำ)'); } } catch(err){ alert('บันทึกไม่สำเร็จ: ' + (err.message || err)); } finally { setLoading(false); } }
async function deleteRecord(id){ if(state.user.role!=='admin'){ alert('เฉพาะ Admin เท่านั้นที่ลบข้อมูลได้'); return; } if(!confirm('ต้องการลบข้อมูลนี้ใช่หรือไม่?')) return; setLoading(true); try { await run('deleteRecord',{user:state.user,id}); await refresh(); } catch(err){ alert('ลบไม่สำเร็จ: ' + (err.message || err)); } finally { setLoading(false); } }
function usersView(){ 
  const roleLabel=r=>r==='admin'?'ผู้ดูแลระบบ':r==='viewer'?'ผู้ดูอย่างเดียว':'เจ้าหน้าที่';
  return `<div><h2 class="text-xl font-bold mb-4">ผู้ใช้งาน</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">ชื่อผู้ใช้</th><th class="p-3 text-left">ชื่อ-สกุล</th><th class="p-3 text-left">หน่วยงาน</th><th class="p-3 text-left">สิทธิ์</th><th class="p-3 text-left">สถานะ</th><th class="p-3 text-left">จัดการ</th></tr></thead><tbody>${state.users.map(u=>`<tr class="border-t"><td class="p-3">${esc(u.username)}</td><td class="p-3">${esc(u.name)}</td><td class="p-3">${esc(u.hospital)}</td><td class="p-3"><select class="input py-1" onchange="setUserRoleUi('${u.uid}',this.value)" ${u.uid===state.user.uid?'disabled':''}><option value="staff" ${u.role==='staff'?'selected':''}>Staff</option><option value="viewer" ${u.role==='viewer'?'selected':''}>Viewer</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td><td class="p-3">${u.status==='pending'?'<span class="text-amber-600 font-semibold">รออนุมัติ</span>':u.status==='disabled'?'<span class="text-red-600 font-semibold">ปิดใช้งาน</span>':'<span class="text-emerald-600 font-semibold">ใช้งานได้</span>'}</td><td class="p-3">${u.status==='pending'?`<button class="text-emerald-600 px-2" onclick="approveUser('${u.uid}')">อนุมัติ</button>`:''}${u.uid!==state.user.uid?`<button class="text-amber-600 px-2" onclick="resetUserPasswordUi('${u.uid}','${esc(u.username)}')">รีเซ็ตรหัส</button><button class="text-red-600 px-2" onclick="deleteUserAccount('${u.uid}')">ปิดบัญชี</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;

async function approveUser(uid){ setLoading(true); try { await run('approveUser',{user:state.user,uid,role:'staff'}); state.users = await run('listUsers', state.user); } catch(err){ alert('อนุมัติไม่สำเร็จ: ' + (err.message || err)); } finally { setLoading(false); } }
async function setUserRoleUi(uid,role){ if(!confirm('ต้องการเปลี่ยนสิทธิ์ผู้ใช้นี้เป็น '+role+' ใช่หรือไม่?')){ await refresh(); return; } setLoading(true); try { await run('setUserRole',{user:state.user,uid,role}); state.users=await run('listUsers',state.user); } catch(err){ alert('เปลี่ยนสิทธิ์ไม่สำเร็จ: '+(err.message||err)); } finally { setLoading(false); } }
async function deleteUserAccount(uid){ if(!confirm('ต้องการลบผู้ใช้งานนี้ใช่หรือไม่?')) return; setLoading(true); try { await run('deleteUser',{user:state.user,uid}); state.users = await run('listUsers', state.user); } catch(err){ alert('ลบไม่สำเร็จ: ' + (err.message || err)); } finally { setLoading(false); } }

        </div>

async function submitChangePassword(e){
  e.preventDefault();
  const form=e.target;
  const currentPassword=form.currentPassword.value;
  const newPassword=form.newPassword.value;
  const confirmPassword=form.confirmPassword.value;
  const box=document.getElementById('passwordError');

  if(newPassword.length<8){
    box.className='rounded-lg p-3 text-sm bg-red-50 text-red-700';
    box.textContent='รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร';
    return;
  }
  if(newPassword!==confirmPassword){
    box.className='rounded-lg p-3 text-sm bg-red-50 text-red-700';
    box.textContent='รหัสผ่านใหม่และการยืนยันรหัสผ่านไม่ตรงกัน';
    return;
  }
  if(currentPassword===newPassword){
    box.className='rounded-lg p-3 text-sm bg-red-50 text-red-700';
    box.textContent='รหัสผ่านใหม่ต้องแตกต่างจากรหัสผ่านเดิม';
    return;
  }

  const submitBtn=form.querySelector('button[type="submit"]');
  submitBtn.disabled=true;
  submitBtn.textContent='กำลังบันทึก...';
  try{
    await run('changePassword',{user:state.user,currentPassword,newPassword});
    closePasswordModal();
    alert('เปลี่ยนรหัสผ่านสำเร็จ\n\nเพื่อความปลอดภัย กรุณาเข้าสู่ระบบใหม่ด้วยรหัสผ่านใหม่');
    await logout();
  }catch(err){
    box.className='rounded-lg p-3 text-sm bg-red-50 text-red-700';
    box.textContent='เปลี่ยนรหัสผ่านไม่สำเร็จ: '+(err.message||err);
    submitBtn.disabled=false;
    submitBtn.textContent='บันทึกรหัสผ่านใหม่';
  }
}

async function resetUserPasswordUi(uid,username){
  if(state.user.role!=='admin') return;
  if(!confirm('ต้องการรีเซ็ตรหัสผ่านของ '+username+' ใช่หรือไม่?\n\nระบบจะสร้างรหัสผ่านชั่วคราวใหม่ และเซสชันเดิมของผู้ใช้นี้จะถูกยกเลิก')) return;
  setLoading(true);
  try{
    const result=await run('resetUserPassword',{user:state.user,uid});
    await refresh();
    render();
    showTemporaryPassword(result);
  }catch(err){
    alert('รีเซ็ตรหัสผ่านไม่สำเร็จ: '+(err.message||err));
  }finally{
    state.loading=false;
  }
}

async function copyTemporaryPassword(){
  const el=document.getElementById('tempPasswordValue');
  if(!el) return;
  try{
    await navigator.clipboard.writeText(el.value);
    alert('คัดลอกรหัสผ่านชั่วคราวแล้ว');
  }catch(e){
    el.select();
    document.execCommand('copy');
    alert('คัดลอกรหัสผ่านชั่วคราวแล้ว');
  }
}

'พบสารเสพติดต่างชาติ':r.drugFoundForeign,'จิตเวชต่างชาติ':r.psychTotalForeign,'รับยาต่อเนื่องต่างชาติ':r.psychMedsForeign,'คลอดรพ.สต.ในเขต':r.deliveryHealthCenterLocal,'คลอดรพ.สต.นอกเขตตาก':r.deliveryHealthCenterTak,'คลอดรพ.สต.นอกเขตเชียงใหม่':r.deliveryHealthCenterChiangMai})); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'MCH_Data'); XLSX.writeFile(wb,`MCH_SopMoei_${Date.now()}.xlsx`); }
async function importFile(e){ if(state.user.role!=='admin'){ alert('เฉพาะ Admin เท่านั้นที่นำเข้าข้อมูลได้'); return; } const file=e.target.files[0]; if(!file) return; const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}); const records=rows.map(row=>{const item={}; Object.keys(FIELD_MAP).forEach(f=>{const k=FIELD_MAP[f].find(key=>Object.prototype.hasOwnProperty.call(row,key)); item[f]=k?row[k]:'';}); NUM_FIELDS.forEach(f=>item[f]=Number(item[f]||0)); return item;}); setLoading(true); try { await run('importRecords',{user:state.user,records}); await refresh(); } catch(err){ alert('นำเข้าไม่สำเร็จ: ' + (err.message || err)); } finally { setLoading(false); } }
